# GRIEFER event bus.
#
# Credentials come from the environment. NATS expands $VAR at config load, so
# no password is ever written into this file or baked into the image.

port: 4222
http_port: 8222

server_name: griefer-nats

# Authentication is not optional. An unauthenticated JetStream server is a
# writable, readable record of every security event GRIEFER has seen.
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}

jetstream {
  store_dir: "/data"
  # Bounded on purpose: a telemetry flood must not be able to fill the volume
  # and take the bus down with it.
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Bounded connection and payload limits, for the same reason.
max_payload: 4MB
max_connections: 256
max_control_line: 8KB

# Quiet by default. Debug and trace logging on a bus carrying security events
# would write the events themselves into the log.
debug: false
trace: false
logtime: true
