name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed vulnerability in a pinned dependency surfaces
    # without waiting for someone to open a pull request.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: govulncheck
        # Blocking. A known-exploitable path in a dependency is not advisory.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Version comes from "packageManager" in the root package.json.
      # Setting it here as well makes the action refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: pnpm audit
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version="8.30.1"
          curl -sSL --fail \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        # The binary directly rather than the action wrapper: one fewer
        # third-party action holding a token, and the exit code is ours to read.
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1

      - name: Scan the working tree for secrets
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1

  filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          # .trivyignore.yaml carries one accepted finding, scoped to the one
          # file it applies to, with the reason and the runtime check written
          # next to the rule id. YAML because the plain-text format cannot
          # scope an entry to a path — see the comments in that file.
          trivyignores: .trivyignore.yaml

  images:
    name: Image scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Uploading SARIF to the Security tab needs this and nothing more.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: griefer-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the console image
        uses: docker/build-push-action@v6
        with:
          context: ./console
          push: false
          load: true
          tags: griefer-console:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: griefer-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan the console image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: griefer-console:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM — API image
        uses: anchore/sbom-action@v0
        with:
          image: griefer-api:scan
          format: spdx-json
          artifact-name: griefer-api.spdx.json
          output-file: griefer-api.spdx.json

      - name: SBOM — console image
        uses: anchore/sbom-action@v0
        with:
          image: griefer-console:scan
          format: spdx-json
          artifact-name: griefer-console.spdx.json
          output-file: griefer-console.spdx.json

      - name: Publish SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*.spdx.json"
          retention-days: 90

  policy-invariants:
    name: Policy invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Policy unit tests
        run: opa test policies/rego -v

      - name: Assert the policy still denies what it must
        # A second, independent check on the rules that must never regress, run
        # against the policy source rather than through the platform. If the Go
        # side and the Rego side ever disagree, this catches it.
        run: |
          set -euo pipefail
          assert_effect() {
            local name="$1" expected="$2" input="$3"
            local actual
            actual="$(echo "$input" > /tmp/policy-input.json && \
              opa eval -d policies/rego -i /tmp/policy-input.json \
                'data.griefer.response.decision.effect' --format=raw | tr -d '"')"
            printf '  %-46s %-16s' "$name" "$actual"
            if [ "$actual" != "$expected" ]; then
              printf 'FAIL (expected %s)\n' "$expected"
              return 1
            fi
            printf 'ok\n'
          }

          base_action='"mode":"simulate","known":true,"reversible":true,"rollback_action":"r","targets_critical_asset":false,"isolation":false'
          strong_incident='"risk_score":81,"evidence_categories":["a","b","c"]'

          assert_effect "destructive action" deny \
            "{\"action\":{\"type\":\"wipe_endpoint\",\"destructive\":true,${base_action},\"reversible\":false},\"incident\":{${strong_incident}},\"request\":{\"automated\":false}}"

          assert_effect "action outside the catalog" deny \
            "{\"action\":{\"type\":\"unknown\",\"destructive\":false,${base_action},\"known\":false},\"incident\":{${strong_incident}},\"request\":{\"automated\":true}}"

          assert_effect "malformed input" deny \
            '{"action":{"type":"require_mfa"}}'

          assert_effect "empty input" deny '{}'

          assert_effect "irreversible action" require_approval \
            "{\"action\":{\"type\":\"revoke_sessions\",\"destructive\":false,${base_action},\"reversible\":false,\"rollback_action\":\"\"},\"incident\":{${strong_incident}},\"request\":{\"automated\":true}}"

          assert_effect "critical asset" require_approval \
            "{\"action\":{\"type\":\"require_mfa\",\"destructive\":false,${base_action},\"targets_critical_asset\":true},\"incident\":{${strong_incident}},\"request\":{\"automated\":true}}"

          assert_effect "single weak signal, isolation" require_approval \
            "{\"action\":{\"type\":\"isolate_endpoint\",\"destructive\":false,${base_action},\"isolation\":true},\"incident\":{\"risk_score\":11,\"evidence_categories\":[\"a\"]},\"request\":{\"automated\":true}}"

          assert_effect "execute mode" require_approval \
            "{\"action\":{\"type\":\"require_mfa\",\"destructive\":false,${base_action},\"mode\":\"execute\"},\"incident\":{${strong_incident}},\"request\":{\"automated\":false}}"

          assert_effect "corroborated simulation" allow \
            "{\"action\":{\"type\":\"preserve_evidence\",\"destructive\":false,${base_action}},\"incident\":{${strong_incident}},\"request\":{\"automated\":true}}"

          echo "All policy invariants hold."
