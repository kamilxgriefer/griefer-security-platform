# GRIEFER local stack.
#
#   make up      start everything
#   make demo    replay the synthetic scenario
#   make down    stop and remove volumes
#
# Every port is published to 127.0.0.1 only. GRIEFER v0.1 has no
# authentication, so nothing here may be reachable from the network.

name: griefer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: griefer
      # Local development credential. It is deliberately visible: this stack is
      # for a laptop, and a value hidden in a file would only look secret.
      # Any shared deployment must supply its own via a secret manager.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-griefer_local_dev}
      POSTGRES_DB: griefer
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griefer -d griefer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  nats:
    # The same image the platform runs: JetStream on, authentication required,
    # non-root. Building it here rather than pulling the upstream image means
    # the local stack exercises the deployed configuration — including the fact
    # that an anonymous client is refused.
    build:
      context: .
      dockerfile: deployments/railway/nats/Dockerfile
    restart: unless-stopped
    environment:
      NATS_USER: ${NATS_USER:?NATS_USER is required, run make secrets}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      # NATS's own monitoring endpoint, enabled by http_port in nats.conf. It
      # answers without a credential; the client port does not, which is the
      # point. `nats-server --signal status` looks the part but needs a pid it
      # cannot resolve as PID 1, so it reports unhealthy on a healthy server.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  opa:
    # Policy is baked into the image and OPA's management API is read-only. A
    # mounted policy directory would let anything with write access to the host
    # rewrite the rules that decide what GRIEFER may do.
    build:
      context: .
      dockerfile: deployments/railway/opa/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/opa", "eval", "--data", "/policies/rego", "data.griefer.response.policy_version"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Named explicitly: a build with no target produces the LAST stage in the
      # file, which is the test stage. Without this the API image is a Go build
      # environment that exits immediately.
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        # service_started, not service_healthy. The architecture states that the
        # event bus is NOT required for the API to serve: ingestion continues
        # without fan-out. Blocking API startup on the bus would contradict that
        # in the one place it is easiest to get wrong.
        condition: service_started
      opa:
        condition: service_healthy
    environment:
      GRIEFER_ENV: local
      GRIEFER_HTTP_ADDR: 0.0.0.0:8080
      # The container's own interface is not the host's. The published port
      # below is bound to loopback, which is what actually limits exposure.
      GRIEFER_ALLOW_PUBLIC_BIND: "true"
      GRIEFER_STORAGE_POSTGRES: "true"
      DATABASE_URL: postgres://griefer:${POSTGRES_PASSWORD:-griefer_local_dev}@postgres:5432/griefer?sslmode=disable
      GRIEFER_NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:?NATS_USER is required}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
      GRIEFER_NATS_STREAM: GRIEFER_EVENTS
      GRIEFER_NATS_SUBJECT: griefer.events.v1
      OPA_URL: http://opa:8181
      GRIEFER_OPA_DECISION_PATH: griefer/response/decision
      GRIEFER_OPA_FAIL_CLOSED: "true"
      RESPONSE_MODE: ${RESPONSE_MODE:-simulation}
      ALLOW_REAL_ACTIONS: ${ALLOW_REAL_ACTIONS:-false}
      SYNTHETIC_DATA_ONLY: ${SYNTHETIC_DATA_ONLY:-true}
      # Loads the synthetic scenario into an empty deployment, before the
      # server starts listening. A no-op once an incident exists.
      SEED_SYNTHETIC_DEMO: ${SEED_SYNTHETIC_DEMO:-false}
      # Every application endpoint requires this. /health and /ready do not, so
      # the platform can probe a service before it holds any credential.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      GRIEFER_LOG_FORMAT: json
      GRIEFER_LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The image has no shell and no curl; the binary answers its own probe.
      test: ["CMD", "/app/griefer-api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      RESPONSE_MODE: ${RESPONSE_MODE:-simulation}
      # Server-side only. Every call to the API happens in a React Server
      # Component or in the server-side gateway, so no browser ever talks to
      # the API directly and there is no CORS surface to configure.
      GRIEFER_API_BASE_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # The access gate. Without a usable administrator credential the console
      # refuses every request rather than serving incident data — a gate that
      # fails open is worse than no gate, because it looks protected.
      # The administrator is required. A deployment with no administrator has
      # nobody who can provision the rest, so the stack refuses to start rather
      # than come up with a console nobody can manage.
      GRIEFER_ADMIN_USERNAME: ${GRIEFER_ADMIN_USERNAME:-admin}
      GRIEFER_ADMIN_PASSWORD_SALT: ${GRIEFER_ADMIN_PASSWORD_SALT:?GRIEFER_ADMIN_PASSWORD_SALT is required}
      GRIEFER_ADMIN_PASSWORD_HASH: ${GRIEFER_ADMIN_PASSWORD_HASH:?GRIEFER_ADMIN_PASSWORD_HASH is required}
      # The analyst is optional: a deployment may legitimately start with only
      # an administrator, who then provisions the others.
      GRIEFER_ANALYST_USERNAME: ${GRIEFER_ANALYST_USERNAME:-analyst}
      GRIEFER_ANALYST_PASSWORD_SALT: ${GRIEFER_ANALYST_PASSWORD_SALT:-}
      GRIEFER_ANALYST_PASSWORD_HASH: ${GRIEFER_ANALYST_PASSWORD_HASH:-}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?DEMO_SESSION_SECRET is required}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # The Next.js image has node but no curl.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  nats-data:
