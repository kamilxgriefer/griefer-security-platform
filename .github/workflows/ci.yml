name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. A job that needs more requests it explicitly.
permissions:
  contents: read

# Cancel superseded runs on a branch. main is excluded: a push to main should
# always produce a complete result, even if another lands behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: griefer
          POSTGRES_PASSWORD: griefer_ci
          POSTGRES_DB: griefer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U griefer -d griefer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Module and build caches are keyed on go.sum, so a dependency change
          # invalidates them. Caching a compiler cache is safe; caching build
          # output across dependency changes is not.
          cache-dependency-path: go.sum

      - name: Verify module integrity
        run: |
          go mod verify
          go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^console/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Check Rego formatting
        run: opa fmt --fail policies/rego

      - name: Type-check the policy
        run: opa check policies/rego

      - name: Policy unit tests
        run: opa test policies/rego -v

      - name: Start OPA
        run: |
          opa run --server --addr 127.0.0.1:8181 policies/rego &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8181/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8181/health

      - name: Start NATS with JetStream
        # A service container cannot take a command, and NATS only enables
        # JetStream when asked. Without --jetstream the server answers TCP but
        # refuses stream creation, which surfaces as "no responders available"
        # rather than as a connection failure.
        run: |
          docker run -d --name griefer-nats -p 4222:4222 nats:2-alpine \
            --jetstream --store_dir=/data
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1
          echo "NATS is listening with JetStream enabled"

      - name: Tests
        env:
          GRIEFER_TEST_POSTGRES_DSN: postgres://griefer:griefer_ci@127.0.0.1:5432/griefer_test?sslmode=disable
          GRIEFER_TEST_NATS_URL: nats://127.0.0.1:4222
          GRIEFER_TEST_OPA_URL: http://127.0.0.1:8181
        # -p 1 runs one package's test binary at a time.
        #
        # internal/storage and tests/integration both read
        # GRIEFER_TEST_POSTGRES_DSN, and the storage conformance suite TRUNCATEs
        # every table between cases. Go runs package binaries concurrently by
        # default, so a truncate could delete the incident the integration test
        # had just created — which surfaced as "Incident not found" from a test
        # that had done nothing wrong.
        #
        # The race was always there; widening the storage suite made it fire.
        # Serialising is the blunt fix. The right one is a database per suite,
        # which needs the harnesses to stop sharing one DSN — recorded in the
        # pull request rather than rushed in here.
        run: go test -race -p 1 -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/griefer-api ./cmd/griefer-api
          CGO_ENABLED=0 go build -trimpath -o /tmp/griefer-seed ./cmd/griefer-seed

      - name: Smoke test the built binary
        run: |
          /tmp/griefer-api -print-config
          GRIEFER_HTTP_ADDR=127.0.0.1:18080 /tmp/griefer-api &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/ready >/dev/null && break
            sleep 1
          done
          # The demo must survive a real end-to-end replay, or the README lies.
          /tmp/griefer-seed -api http://127.0.0.1:18080
          curl -sf 'http://127.0.0.1:18080/api/v1/incidents?limit=1' | grep -q '"risk_score"'

  golangci:
    name: Lint (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        # Built with this job's Go toolchain rather than downloading a release
        # binary: a prebuilt linter compiled with an older Go refuses to load a
        # module that targets a newer one.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  console:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      # Setting it here as well makes the action refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  schemas:
    name: Schemas and detection content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install --quiet openapi-spec-validator pyyaml jsonschema

      - name: Validate the OpenAPI document
        run: |
          python - <<'PY'
          from openapi_spec_validator import validate
          from openapi_spec_validator.readers import read_from_filename
          spec, _ = read_from_filename("api/openapi.yaml")
          validate(spec)
          print(f"OpenAPI valid: {len(spec['paths'])} paths, "
                f"{len(spec['components']['schemas'])} schemas")
          PY

      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for path in sorted(pathlib.Path("schemas").rglob("*.json")):
              schema = json.loads(path.read_text())
              Draft202012Validator.check_schema(schema)
              print(f"valid: {path}")
          PY

      - name: Validate YAML and check for duplicate keys
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      raise ValueError(
                          f"duplicate key {key!r} at line {key_node.start_mark.line + 1}")
                  seen[key] = loader.construct_object(value_node, deep=deep)
              return seen

          Strict.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates)

          failed = False
          for path in sorted(pathlib.Path(".").rglob("*.y*ml")):
              if any(part in {"node_modules", ".next", ".git"} for part in path.parts):
                  continue
              try:
                  yaml.load(path.read_text(), Loader=Strict)
                  print(f"valid: {path}")
              except Exception as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The test stage is last in the file, and a build with no target
          # produces the last stage.
          target: runtime
          push: false
          load: true
          tags: griefer-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the console image
        uses: docker/build-push-action@v6
        with:
          context: ./console
          file: ./console/Dockerfile
          push: false
          load: true
          tags: griefer-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the API image runs as a non-root user
        run: |
          user="$(docker run --rm --entrypoint="" griefer-api:ci /app/griefer-api -print-config >/dev/null 2>&1; docker inspect -f '{{.Config.User}}' griefer-api:ci)"
          echo "image user: ${user}"
          if [ "${user}" = "root" ] || [ -z "${user}" ]; then
            echo "::error::The API image must not run as root"
            exit 1
          fi

      - name: Verify the console image ships no package manager
        run: |
          for tool in npm npx corepack yarn; do
            if docker run --rm --entrypoint="" griefer-console:ci sh -c "command -v ${tool}" 2>/dev/null; then
              echo "::error::${tool} is present in the console runtime image"
              exit 1
            fi
          done
          echo "no package manager in the console runtime image"
          docker run --rm --entrypoint="" griefer-console:ci node --version

      - name: Validate the Compose stack
        # .env.example supplies the required variables. Without an env file
        # the interpolation of every ${VAR:?...} fails, which reports a missing
        # secret as though the compose file itself were malformed.
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q \
            && echo "docker-compose.yml is valid"

  deployment-image-contract:
    name: Deployment image contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static contract checks
        run: ./scripts/verify-image-contract.sh

      # Built exactly the way the platform builds them: the Dockerfile named in
      # deployments/railway/*.json, that file's own context, and NO --target.
      # Passing --target here would test something the platform never produces,
      # which is precisely how the console came to run the API's build stage.
      - name: Build the API image as the platform builds it
        run: docker build -f Dockerfile -t griefer-api:contract .

      - name: Build the console image as the platform builds it
        # -f is resolved against the working directory, NOT against the build
        # context, so "-f Dockerfile ./console" builds the API's Dockerfile with
        # the console's files. This job was written with that mistake in it,
        # which is a fair demonstration of why it exists.
        run: docker build -f console/Dockerfile -t griefer-console:contract ./console

      - name: The API image runs the API
        run: |
          set -euo pipefail
          # A distroless image has no shell, so PID 1 is inspected from outside.
          entrypoint=$(docker inspect -f '{{json .Config.Entrypoint}}' griefer-api:contract)
          echo "entrypoint: $entrypoint"
          case "$entrypoint" in
            *griefer-api*) echo "ok: entrypoint is the API binary" ;;
            *) echo "::error::API image entrypoint is $entrypoint"; exit 1 ;;
          esac
          if printf '%s' "$entrypoint" | grep -qi 'go\b\|/usr/local/go'; then
            echo "::error::API image entrypoint looks like a Go toolchain, not the service"
            exit 1
          fi

      - name: The API image refuses unauthenticated calls
        env:
          # Not a secret: a throwaway value this job invents so it can prove the
          # gate opens for a correct credential as well as closing for none.
          CONTRACT_TOKEN: not-a-real-credential-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker run -d --name api-contract -p 18081:8080 \
            -e GRIEFER_HTTP_ADDR=0.0.0.0:8080 \
            -e GRIEFER_ALLOW_PUBLIC_BIND=true \
            -e INTERNAL_API_TOKEN="$CONTRACT_TOKEN" \
            griefer-api:contract
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:18081/health >/dev/null && break
            sleep 1
          done
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$2")
            printf '  %-34s %s (want %s)\n' "$3" "$code" "$1"
            [ "$code" = "$1" ] || { echo "::error::$3 returned $code"; exit 1; }
          }
          check 200 http://127.0.0.1:18081/health           "/health without a token"
          check 200 http://127.0.0.1:18081/ready            "/ready without a token"
          check 401 http://127.0.0.1:18081/api/v1/incidents "/api/v1/* without a token"
          check 401 http://127.0.0.1:18081/metrics          "/metrics without a token"
          # And the same call succeeds once the credential is presented, so the
          # 401s above are the gate working rather than the service being down.
          # The value comes from the environment rather than the command line:
          # a literal bearer token here is indistinguishable, to a secret
          # scanner, from a real one — and teaching the scanner to ignore this
          # file is how a real credential eventually gets committed.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CONTRACT_TOKEN" \
            http://127.0.0.1:18081/api/v1/incidents)
          echo "  /api/v1/incidents with a token   $code (want 200)"
          [ "$code" = "200" ] || { echo "::error::authenticated call returned $code"; exit 1; }

      - name: The API image shuts down gracefully
        run: |
          set -euo pipefail
          docker stop -t 20 api-contract >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' api-contract)
          echo "  exit code after SIGTERM: $code"
          # 143 is SIGTERM-killed: the process ignored the signal and was killed
          # after the timeout, which is not a graceful shutdown.
          [ "$code" = "0" ] || { echo "::error::API did not exit cleanly on SIGTERM (code $code)"; exit 1; }

      - name: The console image runs the console
        run: |
          set -euo pipefail
          docker run -d --name console-contract -p 18082:3000 \
            -e NODE_ENV=production \
            -e DEMO_SESSION_SECRET=contract-session-secret-at-least-32-chars \
            -e GRIEFER_ADMIN_USERNAME=admin \
            -e GRIEFER_ADMIN_PASSWORD_SALT=00 \
            -e GRIEFER_ADMIN_PASSWORD_HASH=00 \
            griefer-console:contract
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:18082/login >/dev/null && break
            sleep 1
          done
          echo "  PID 1:"
          docker exec console-contract cat /proc/1/cmdline | tr '\0' ' '; echo
          if docker exec console-contract cat /proc/1/cmdline | tr '\0' ' ' | grep -q 'griefer-api'; then
            echo "::error::the console image is running the API binary"
            exit 1
          fi
          # Next renames its own process to "next-server (v…)", so PID 1 is not
          # literally "node" even though it is the Node server. Both spellings
          # are accepted; what matters is that it is the console's server and
          # not some other binary that happened to end up in this image.
          pid1=$(docker exec console-contract cat /proc/1/cmdline | tr '\0' ' ')
          case "$pid1" in
            *next-server*|*node*) : ;;
            *) echo "::error::PID 1 in the console image is '$pid1', which is neither the Next server nor node"; exit 1 ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/login)
          echo "  /login  $code (want 200)"
          [ "$code" = "200" ] || { echo "::error::/login returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/)
          echo "  /       $code (want 307, the redirect to /login)"
          [ "$code" = "307" ] || { echo "::error::/ returned $code"; exit 1; }
          # The container must still be running: an image that exits 0 without
          # ever serving would pass every check above that only looks at logs.
          state=$(docker inspect -f '{{.State.Running}}' console-contract)
          echo "  still running: $state"
          [ "$state" = "true" ] || { echo "::error::console container is not running"; exit 1; }

      - name: Tear down
        if: always()
        run: docker rm -f api-contract console-contract >/dev/null 2>&1 || true

  compose-e2e:
    name: Compose end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres nats opa api

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ready >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ready | tee /dev/stderr | grep -q '"status":"ready"'

      # The API requires a service credential, so the seed has to present the
      # same one the stack was started with. Sourcing .env keeps the two in
      # step; hard-coding a value here would drift the moment .env.example does.
      - name: Replay the demonstration scenario
        run: |
          set -a; . ./.env; set +a
          go run ./cmd/griefer-seed -api http://127.0.0.1:8080

      - name: Assert the documented outcome and policy verdicts
        run: |
          set -a; . ./.env; set +a
          python3 scripts/verify-demo.py http://127.0.0.1:8080

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
