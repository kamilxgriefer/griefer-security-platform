version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels:
      - "type:security"
      - "area:backend"
    groups:
      # Grouped so a security bump is not lost among routine version churn.
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels:
      - "type:security"
      - "area:console"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "type:security"
      - "area:infrastructure"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels:
      - "type:security"
      - "area:infrastructure"

  - package-ecosystem: docker
    directory: /console
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels:
      - "type:security"
      - "area:infrastructure"
