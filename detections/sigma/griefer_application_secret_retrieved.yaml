title: Application Secret Retrieved From Secret Store
id: e001f349-1b96-4c51-9498-468de6eb6270
status: experimental
description: |
  Detects a read of a stored application secret. The value of this signal comes
  from what the secret unlocks; correlate with the asset inventory before
  treating it as an incident on its own.
references:
  - https://github.com/kamilxgriefer/griefer-security-platform/blob/main/docs/ATTACK_SCENARIOS.md
author: GRIEFER project
date: 2026/08/23
tags:
  - attack.credential_access
  - attack.t1552.001
logsource:
  category: application
  product: griefer
detection:
  selection:
    event_type: secret_accessed
    target.type: secret
  condition: selection
falsepositives:
  - Application startup reading its own configured secret
  - Approved secret rotation workflows
level: high
