# GRIEFER gitleaks configuration.
#
# Two scans run in CI: one over git history, and one over the working tree. The
# working-tree scan exists to catch a secret in a file that is present but not
# yet committed — a forgotten .env, a downloaded key. It does NOT respect
# .gitignore, so without this allowlist it also scans build output.
#
# Next.js bundles inline example strings that match generic-credential patterns.
# Those are not GRIEFER secrets, they are not committed, and letting them fail
# the scan would train everyone to ignore it — which is how a real finding gets
# missed.

[extend]
useDefault = true

[[rules]]
id = "griefer-secret-assignment"
description = "A GRIEFER secret assigned a value in a file left in the working tree"
# The variables this deployment actually uses, rather than a generic guess.
# A stray .env, .env.backup or exported shell snippet holding any of these
# is exactly the accident the working-tree scan exists to catch.
regex = '''(?i)^\s*(?:export\s+)?(INTERNAL_API_TOKEN|DEMO_SESSION_SECRET|DEMO_PASSWORD_HASH|DEMO_PASSWORD_SALT|NATS_PASSWORD|POSTGRES_PASSWORD|DATABASE_URL|GRIEFER_POSTGRES_DSN|GRIEFER_[A-Z_]*(?:TOKEN|SECRET|PASSWORD|KEY))\s*=\s*\S+'''
[rules.allowlist]
description = "Documented placeholders and visible local-development defaults"
regexes = [
  # .env.example ships local defaults on purpose; they are not secrets.
  '''griefer_local_dev''',
  '''<[a-z-]+>''',
  '''REPLACE_ME''',
]
paths = ['''\\.env\\.example$''', '''^docs/''', '''\\.md$''']

[allowlist]
description = "Build output, vendored dependencies, and the one documented local secrets file"
paths = [
  # .env.local is created by `make secrets` and exists to hold local secrets.
  # Flagging it on every run is noise, and a scanner that always reports
  # something is a scanner people stop reading.
  #
  # Note this is deliberately ONE exact filename, not a .env* pattern: a stray
  # .env, .env.production or .env.backup is exactly the accident this scan is
  # meant to catch, and those are still scanned.
  '''^\.env\.local$''',

  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.local/''',
  '''(^|/)bin/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
]

# One historical finding that cannot be removed and must not be hidden broadly.
#
# Commit 21f2c49 wrote an inline `Authorization: Bearer <literal>` into a CI
# job. The literal was "contract-token-not-a-secret" — a value that job
# invented so it could prove the API's gate OPENS for a correct credential as
# well as closing for none. It granted nothing and was never valid anywhere.
#
# gitleaks was right to flag it. A scanner cannot tell a throwaway from a real
# credential, and that inability is what makes it useful. The very next commit
# stopped writing credential-shaped literals at all — the value now comes from
# the environment. But 21f2c49 is already in a pushed branch, and removing it
# would mean rewriting published history.
#
# Scoped to that ONE commit: not the file, not the rule, not the path, any of
# which would also hide the next real credential written there. A
# commit-scoped exception cannot hide a future secret, because a future secret
# arrives in a different commit.
commits = ["21f2c49c1a8585fa195aaeae98f8f0bc10b92707"]
